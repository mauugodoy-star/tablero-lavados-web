<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#002356">
<title>Tablero de Lavados · Paquetexpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Red+Hat+Display:wght@500;700;800;900&family=Red+Hat+Mono:wght@500;600;700&family=Roboto+Condensed:wght@800&display=swap">
<style>
:root{--top:#002356;--brand:#002D87;--accent:#004CE5;--red:#FF1B39;--spray:#9FD4FF;--muted:#A9B8D6;
  --card:rgba(255,255,255,.96);--ink:#0B1A3A;--ink2:#3A4A6B;--line:#DCE1EA;--field:#F4F6FA;--bad:#D3112C;color-scheme:light;
  --f-display:"Red Hat Display","Montserrat",system-ui,sans-serif;--f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--card:rgba(10,24,58,.92);--ink:#EEF2FA;--ink2:#B4C0DA;--line:#22356A;--field:#11244F;--bad:#FF5C72;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#00143A;color:#fff;font:15px/1.5 var(--f-body);overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,15,46,.92) 0,rgba(0,15,46,.74) 30%,rgba(0,15,46,.12) 52%,rgba(0,15,46,0) 70%);transition:opacity .8s ease}
.ui{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left));transition:opacity .45s ease,transform .45s ease}
.hdr{display:flex;align-items:center;gap:16px}
.hdr img{height:26px;width:auto;display:block}
.hdr .sep{width:1px;height:30px;background:rgba(255,255,255,.22)}
.hdr .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hdr b{display:block;font-size:16px;font-weight:700;line-height:1.15}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:430px;gap:22px}
.tag{margin:0;display:inline-flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--spray)}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--spray);animation:pulso 2.2s ease-out infinite}
h1{margin:6px 0 0;font:900 clamp(38px,4.6vw,60px)/.95 var(--f-display);letter-spacing:-.03em;text-shadow:0 2px 24px rgba(0,10,34,.55)}
.sub{margin:10px 0 0;color:#C9D4EA;font-size:15.5px;max-width:36ch}
form{background:var(--card);color:var(--ink);border-radius:18px;padding:22px 22px 18px;box-shadow:0 30px 70px -24px rgba(0,8,30,.8);border-top:4px solid var(--red);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
form h2{margin:0;font:800 20px var(--f-display)}
form p.s{margin:2px 0 12px;font-size:13.5px;color:var(--ink2)}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:10px 0 5px}
input[type=text],input[type=password]{width:100%;min-height:48px;padding:0 12px;font:500 16px var(--f-body);border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
input:focus{outline:3px solid var(--accent);outline-offset:1px}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:14px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink2)}
.chk input{width:18px;height:18px;margin:0}
button{width:100%;margin-top:16px;min-height:50px;font:700 16px var(--f-body);border:0;border-radius:10px;background:linear-gradient(135deg,#002356,#0A45C4);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.7;cursor:wait}
#err{min-height:20px;margin-top:10px;font-size:14px;color:var(--bad);font-weight:600}
.pie{font-size:12px;color:var(--ink2);text-align:center}
.rails{position:fixed;left:0;right:0;bottom:0;z-index:3;display:grid;gap:3px;pointer-events:none}
.rails i{display:block;height:3px;background:#1E63F2}.rails i+i{height:2px;background:var(--red)}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(159,212,255,.6)}100%{box-shadow:0 0 0 12px rgba(159,212,255,0)}}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.main>*{animation:sube .6s cubic-bezier(.2,.7,.2,1) backwards}.main>:nth-child(2){animation-delay:.12s}
body.sale .ui{opacity:0;transform:translateY(10px);pointer-events:none}
body.sale .shade{opacity:0}
#velo{position:fixed;inset:0;z-index:5;background:#F5F5F5;opacity:0;pointer-events:none;transition:opacity .35s ease}
@media (prefers-color-scheme:dark){#velo{background:#06102A}}
@media (max-width:820px){
  body{overflow:auto}
  .shade{background:linear-gradient(180deg,rgba(0,15,46,.55) 0,rgba(0,15,46,0) 22%,rgba(0,15,46,0) 44%,rgba(0,15,46,.88) 58%,rgba(0,15,46,.96) 100%)}
  .ui{padding-left:16px;padding-right:16px;min-height:100%}
  .main{justify-content:flex-end;max-width:none;padding-top:46vh;gap:14px}
  .intro h1{font-size:30px}.intro .sub{display:none}.tag{display:none}
  .hdr .sep,.hdr .k{display:none}.hdr b{font-size:14px}
}
@media (prefers-reduced-motion:reduce){.main>*{animation:none}.tag i{animation:none}}
</style>
</head>

/* ---------- lavadores ---------- */

/* ---------- suciedad del remolque por zonas ---------- */
function lodo(x,yt,U,L,a0,a1,k){if(a1<=a0||k<=0)return;cx.save();cx.beginPath();cx.rect(a0,yt,a1-a0,U);cx.clip();

  cx.fillStyle="rgba(82,62,38,"+(.42*k).toFixed(3)+")";for(let i=0;i<70;i++){const sx=x+azar(i)*L,sh=U*(.25+azar(i+50)*.65);cx.fillRect(sx,yt+U-sh,U*.02+azar(i+90)*U*.05,sh);}
  cx.fillStyle="rgba(70,52,30,"+(.35*k).toFixed(3)+")";for(let i=0;i<40;i++){const sx=x+azar(i+300)*L,sy=yt+U*(.7+azar(i+330)*.3);cx.beginPath();cx.arc(sx,sy,U*(.02+azar(i+360)*.04),0,7);cx.fill();}

/* ---------- cuadro ---------- */
function dibujar(){if(!G)size();logos();const g=G,U=g.U,h=g.h,now=(performance.now()-t0)/1000;
  let f=fin==null?-1:(performance.now()-fin)/1000;
  /* progreso de limpieza por zona y del tracto */
  let c=ZONAS.map((z,i)=>prog(i,now)),cT=prog(1.4,now);

    verde=f>1.0;listo=f>.9;ida=c01((f-.9)/.8);
    if(f>2.4){const tt=f-2.4,dist=W-g.x+U*.8;off=.5*(2*dist/(1.5*1.5))*tt*tt;}

  const x=g.x+off,rot=(off+km)/g.r;

    cx.fillStyle=lg;cx.beginPath();cx.moveTo(fx,fy);cx.lineTo(fx+U*2.4,fy-U*.3);cx.lineTo(fx+U*2.4,g.gy+4);cx.lineTo(fx,g.gy);cx.closePath();cx.fill();}

    if(c[i]<1&&(f<0||f<.9)){escurre(cut-U*.35,cut+U*.02,tr.yt+U*.2,tr.yb);
      cx.fillStyle="rgba(255,255,255,.8)";for(let j=0;j<26;j++){const sx=cut-U*.3+azar(j+i*40)*U*.32,sy=tr.yt+azar(j+i*40+7)*U+Math.sin(T*2+j)*1.2;cx.beginPath();cx.arc(sx,sy,U*(.012+azar(j+i*9)*.025),0,7);cx.fill();}}});
  if(listo&&off<W)destellos(x,tr.yt,g.L,U,9,c01((f-.9)/.5)*(1-ruta*.6));
  /* lavadores (se retiran al terminar) */
  if(alfaPit>0.02){cx.globalAlpha=alfaPit;

    ZONAS.forEach((z,i)=>{const a=g.x+g.L*z[0],b=g.x+g.L*z[1],cut=a+(b-a)*c[i];
      let wx=cut-h*.42+(i===1?Math.sin(T*1.6)*U*.06:0)-sal*(i<1?1:i===1?.6:-.6);const o={paso:ida>0?T*9:T*3};

      else if(ida===0)cepillo(gun,o.ang);});

    {const cut=bT+wT*cT;const o={paso:T*3,ang:-1.15+.3*Math.sin(T*2.1)};let wx=cut-h*.42+sal*.8;if(ida>0){o.ang=.5;o.mira=1;}
      const gun=operador(wx,g.gy,h,o);manguera(beam,gun);if(ida===0&&gun&&cT<1)emitir(gun.tx,gun.ty,o.ang,U*.075,.3,f>=0?10:5,.17);}

    {const px=g.x+g.L+U*1.75;operador(px,g.gy,h,{mira:-1,tableta:true});paleta(px,g.gy,h,verde,-1);}
    cx.globalAlpha=1;}
  if(ruta>0&&Math.random()<.7)emitir(x+g.L*.13,g.gy-2,Math.PI+.4,3,.5,2,.05);

function cuadro(ts){raf=0;if(document.hidden)return;if(ts-last>=31){last=ts;dibujar();}raf=requestAnimationFrame(cuadro);}

size();
if(RM.matches){for(let i=0;i<3;i++)dibujar();}else loop();

/* Se llama al validar el acceso: termina el lavado y la unidad sale a ruta */
window.__portadaFin=function(cb){if(RM.matches||fin!=null){cb();return;}fin=performance.now();alListo=cb;loop();
  setTimeout(()=>{if(!avisado){avisado=true;cb();}},6500);};
})();

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var enc=new TextEncoder();
function b64(s){var a=atob(s),u=new Uint8Array(a.length);for(var i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return u;}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return("0"+x.toString(16)).slice(-2)}).join("");}
try{var ru=localStorage.getItem("tl_user");if(ru){$("u").value=ru;$("r").checked=true;}}catch(e){}
function falla(m){$("err").textContent=m;$("b").disabled=false;$("b").textContent="Ingresar";}
async function entrar(user,pass){
  var u=user.trim().toLowerCase().normalize("NFC");
  var acc=await (await fetch("acceso.json?"+Date.now(),{cache:"no-store"})).json();
  var id=hex(await crypto.subtle.digest("SHA-256",enc.encode("u:"+u))).slice(0,16);
  var me=acc.users.filter(function(x){return x.id===id})[0];
  if(!me)throw new Error("bad");
  var km=await crypto.subtle.importKey("raw",enc.encode(pass.normalize("NFC")),"PBKDF2",false,["deriveKey"]);
  var wk=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(me.salt),iterations:acc.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var raw;
  try{raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(me.iv)},wk,b64(me.ct));}catch(e){throw new Error("bad");}
  var mk=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var d=await (await fetch("data.enc.json?"+Date.now(),{cache:"no-store"})).json();
  var gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(d.iv)},mk,b64(d.ct));
  var txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(txt);
}
var SHIM=function(){

  function col(name){
    var yr=null;
    var o={where:function(f,op,v){if(f==="anio")yr=v;return o;},
      onSnapshot:function(cb){
        var a=[];
        if(name==="lavados")a=W.docs.filter(function(d){return yr==null||d.data.anio===yr});
        else if(name==="equipos")a=W.eq;
        setTimeout(function(){cb(snapDocs(a))},0);

      }};

  }
  function vedado(){return Promise.reject(Object.assign(new Error("Solo consulta"),{code:"permission-denied"}));}

      onSnapshot:function(cb){var d=p==="config/capacidades"?W.cfg:p==="config/medios"?{m:{}}:null;setTimeout(function(){cb({exists:!!d,data:function(){return d||{}}})},0);return function(){};},
      get:function(){var d=p==="config/capacidades"?W.cfg:null;return Promise.resolve({exists:!!d,data:function(){return d||{}}});},
      set:vedado,update:vedado,delete:vedado};},

  var dl={save:function(o){var b=new Blob([o.data]),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);return Promise.resolve();}};
  window.claude={use:function(n){
    if(n==="db")return Promise.resolve(db);

};
function abrir(B){

  var pie='<div id="__sal" style="position:fixed;left:10px;bottom:10px;z-index:99999;display:flex;gap:8px;align-items:center;font:12px system-ui,sans-serif;background:rgba(20,33,61,.88);color:#fff;padding:6px 10px;border-radius:999px">'+(gen?'<span>Datos al '+gen+'</span>':'')+'<button onclick="location.reload()" style="all:unset;cursor:pointer;font-weight:700;text-decoration:underline">Salir</button></div>';

  else html='<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tablero de Lavados</title>'+shim+'</head><body>'+src+pie+'</body></html>';
